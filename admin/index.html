<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de administración — Andy Furgeri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&family=Fraunces:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    const previewStyles = `
      body {
        background: #0B0A10;
        color: #F5F4F0;
        font-family: 'Inter', sans-serif;
        padding: 40px;
      }
      .note-preview-label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #B9A6FF;
        margin-bottom: 16px;
        display: block;
      }
      .note-preview-title {
        font-family: 'Fraunces', serif;
        font-weight: 700;
        font-size: 32px;
        line-height: 1.15;
        margin-bottom: 18px;
        color: #FFFFFF;
      }
      .note-preview-date {
        font-size: 13px;
        color: #9799A6;
        margin-bottom: 28px;
        display: block;
      }
      .note-preview-tags { margin-bottom: 28px; }
      .note-preview-tag {
        display: inline-block;
        font-size: 11px;
        color: #7C5CFC;
        border: 1px solid rgba(124,92,252,0.4);
        border-radius: 100px;
        padding: 4px 12px;
        margin-right: 8px;
      }
      .note-preview-excerpt {
        font-size: 16px;
        color: #B9A6FF;
        border-left: 2px solid #7C5CFC;
        padding-left: 16px;
        margin-bottom: 28px;
        line-height: 1.6;
      }
      .note-preview-content p {
        font-size: 16px;
        line-height: 1.8;
        color: #D5D4DC;
        margin-bottom: 16px;
      }
    `;

    CMS.registerPreviewStyle(previewStyles, { raw: true });

    CMS.registerPreviewTemplate("notas", createClass => {
      return createClass({
        render: function () {
          const entry = this.props.entry;
          const title = entry.getIn(["data", "title"], "");
          const date = entry.getIn(["data", "date"], "");
          const tags = entry.getIn(["data", "tags"], []);
          const excerpt = entry.getIn(["data", "excerpt"], "");
          const content = entry.getIn(["data", "content"], "");
          const paragraphs = (content || "").split("\n\n").filter(Boolean);

          const tagEls = tags && tags.map
            ? tags.map((t, i) => React.createElement("span", { className: "note-preview-tag", key: i }, t))
            : [];

          const paragraphEls = paragraphs.map((p, i) =>
            React.createElement("p", { key: i }, p)
          );

          return React.createElement(
            "div",
            null,
            React.createElement("span", { className: "note-preview-label" }, "Vista previa de nota"),
            React.createElement("h1", { className: "note-preview-title" }, title),
            React.createElement("span", { className: "note-preview-date" }, date),
            React.createElement("div", { className: "note-preview-tags" }, tagEls),
            React.createElement("div", { className: "note-preview-excerpt" }, excerpt),
            React.createElement("div", { className: "note-preview-content" }, paragraphEls)
          );
        }
      });
    });
  </script>
</body>
</html>
