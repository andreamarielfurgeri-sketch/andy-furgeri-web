backend:
  name: github
  repo: andreamarielfurgeri-sketch/andy-furgeri-web
  branch: main
  base_url: https://netlify-cms-oauth-a1ivq2srz.vercel.app
  auth_endpoint: auth

site_url: https://andreafurgeri.com/
display_url: https://andreafurgeri.com/

media_folder: "assets/notas"
public_folder: "/assets/notas"

collections:
  - name: "notas"
    label: "Notas del blog"
    label_singular: "Nota"
    folder: "content/notas"
    create: true
    slug: "{{fields.slug}}"
    extension: "json"
    format: "json"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Slug (sin espacios ni tildes, ej: mi-primera-nota)", name: "slug", widget: "string" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Imagen de portada (opcional)", name: "cover_image", widget: "image", required: false }
      - { label: "Tags", name: "tags", widget: "list", default: ["General"] }
      - { label: "Palabras clave (SEO)", name: "keywords", widget: "list", required: false, hint: "Términos que la gente buscaría para encontrar esta nota" }
      - { label: "Resumen (aparece en la lista)", name: "excerpt", widget: "text" }
      - { label: "Contenido", name: "content", widget: "markdown", buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"], editor_components: ["image"] }
      - { label: "Video embebido (opcional — pegá el link de YouTube o Vimeo)", name: "video_url", widget: "string", required: false }
      - { label: "Archivos adjuntos (opcional)", name: "attachments", widget: "list", required: false, field: { label: "Archivo", name: "file", widget: "file" } }
      - { label: "HTML personalizado (opcional, avanzado)", name: "custom_html", widget: "code", required: false, default_language: "html", allow_language_selection: false, output_code_only: true }
